<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a1b41"/><stop offset="1" stop-color="#0d1624"/></linearGradient></defs>
  <rect width="1200" height="300" rx="20" fill="url(#bg)"/>
  <text x="60" y="108" font-size="54" font-weight="700" fill="#fff">GPT Tools</text>
  <text x="60" y="150" font-size="24" fill="#b9a9d6">for Raycast on Windows</text>
  <text x="60" y="200" font-size="20" fill="#e3d9f5">Fix, rewrite and ask — powered by your ChatGPT plan via Codex CLI. No API key.</text>
  <g font-size="15" fill="#0d1624" font-weight="600">
    <rect x="60" y="230" width="110" height="34" rx="17" fill="#ffd27c"/><text x="115" y="252" text-anchor="middle">Quick Fix</text>
    <rect x="182" y="230" width="100" height="34" rx="17" fill="#7cc4ff"/><text x="232" y="252" text-anchor="middle">Rewrite</text>
    <rect x="294" y="230" width="100" height="34" rx="17" fill="#8be3b0"/><text x="344" y="252" text-anchor="middle">Ask AI</text>
  </g>
  <!-- chat motif -->
  <g transform="translate(760,50)">
    <rect width="340" height="70" rx="14" fill="#3b2a5c"/><text x="20" y="30" font-size="16" fill="#e3d9f5">i has a meeting tomorow</text><text x="20" y="54" font-size="13" fill="#9d8bc0">selected text</text>
    <path d="M170,84 L170,118" stroke="#b9a9d6" stroke-width="2.5"/><path d="M162,110 L170,120 L178,110" fill="none" stroke="#b9a9d6" stroke-width="2.5"/>
    <rect y="130" width="340" height="70" rx="14" fill="#1f5c46"/><text x="20" y="160" font-size="16" fill="#e8fff4">I have a meeting tomorrow.</text><text x="20" y="184" font-size="13" fill="#8be3b0">Quick Fix · replaced in place</text>
  </g>
