<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="960" height="520" rx="14" fill="#1d1d22"/>
  <text x="20" y="28" font-size="12" fill="#8a8a94">Illustration of the Rewrite command (layout, not a screenshot)</text>
  <rect x="16" y="40" width="928" height="56" rx="10" fill="#2a2a31"/>
  <text x="36" y="74" font-size="16" fill="#8a8a94">mention the deadline</text><text x="214" y="74" font-size="16" fill="#fff">▏</text>
  <rect x="770" y="52" width="160" height="32" rx="8" fill="#38383f"/><text x="786" y="73" font-size="14" fill="#e6e6ea">GPT-5.6-Luna  ⌄</text>
  <line x1="16" y1="108" x2="944" y2="108" stroke="#33333a"/>
  <line x1="470" y1="108" x2="470" y2="470" stroke="#33333a"/>
  <text x="32" y="136" font-size="12" fill="#8a8a94">CUSTOM</text>
  <rect x="24" y="146" width="434" height="40" rx="8" fill="#3a3a44"/><text x="44" y="171" font-size="15" fill="#fff">★  Rewrite: mention the deadline</text>
  <text x="32" y="216" font-size="12" fill="#8a8a94">STYLES</text>
  <g font-size="15" fill="#e6e6ea">
    <text x="44" y="246">✦  Improve clarity</text><text x="260" y="246" font-size="13" fill="#8a8a94">Cleaner, easier to read</text>
    <text x="44" y="282">−  Make shorter</text><text x="260" y="282" font-size="13" fill="#8a8a94">Tighter, same meaning</text>
    <text x="44" y="318">☺  More casual</text><text x="260" y="318" font-size="13" fill="#8a8a94">Relaxed, conversational</text>
    <text x="44" y="354">▦  More formal</text><text x="260" y="354" font-size="13" fill="#8a8a94">Professional tone</text>
    <text x="44" y="390">✓  Fix grammar only</text><text x="260" y="390" font-size="13" fill="#8a8a94">No rewording</text>
    <text x="44" y="426">◍  Translate to Dutch</text>
  </g>
  <text x="494" y="136" font-size="17" font-weight="600" fill="#fff">Custom rewrite</text>
  <text x="494" y="162" font-size="14" fill="#b4b4be">Rewrite using your instruction: mention the deadline</text>
  <line x1="494" y1="182" x2="930" y2="182" stroke="#33333a"/>
  <text x="494" y="208" font-size="13" font-weight="600" fill="#e6e6ea">Your text</text>
  <text x="494" y="230" font-size="12" font-style="italic" fill="#8a8a94">Selected in Outlook</text>
  <rect x="494" y="242" width="3" height="76" fill="#55555f"/>
  <text x="508" y="262" font-size="14" fill="#c9c9d2">hi, i wanted to check if you could send</text>
  <text x="508" y="284" font-size="14" fill="#c9c9d2">the report soon, thanks</text>
  <rect x="0" y="476" width="960" height="44" fill="#26262c"/>
  <text x="24" y="504" font-size="13" fill="#8a8a94">Rewrite</text>
  <text x="640" y="504" font-size="13" fill="#e6e6ea">Rewrite  ↵</text><text x="760" y="504" font-size="13" fill="#8a8a94">Actions  Ctrl K</text>
